<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AtaFlow - Inteligência em Reuniões</title>
    
    <!-- Bibliotecas de Design e Ícones -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Biblioteca para gerar o PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        /* Estilos Premium Fixos */
        body { 
            font-family: 'Inter', sans-serif !important; 
            background-color: #0f172a !important; 
            color: #f8fafc !important; 
            min-height: 100vh; 
        }
        .card-premium { 
            background: rgba(30, 41, 59, 0.7) !important; 
            border: 1px solid rgba(71, 85, 105, 0.5) !important; 
            border-radius: 16px !important; 
            backdrop-filter: blur(12px); 
            padding: 24px;
            margin-bottom: 20px;
        }
        .btn-premium { 
            background: linear-gradient(135deg, #2563eb 0%, #4f46e5 100%) !important; 
            border: none !important; 
            color: white !important; 
            font-weight: 600 !important; 
            border-radius: 12px !important; 
            padding: 14px 30px !important; 
            transition: all 0.3s; 
            width: 100%;
        }
        .btn-premium:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 5px 15px rgba(37, 99, 235, 0.4); 
        }
        .nav-link { 
            color: #94a3b8 !important; 
            border: none !important; 
            font-weight: 500;
        }
        .nav-link.active { 
            color: #38bdf8 !important; 
            border-bottom: 2px solid #38bdf8 !important; 
            font-weight: 600 !important; 
            background: transparent !important; 
        }
        .container-workspace {
            max-width: 960px;
            margin: 40px auto;
            padding: 0 20px;
        }
    </style>
</head>
<body>

    <!-- Topbar Executiva -->
    <nav class="navbar border-bottom border-secondary bg-dark bg-opacity-50 py-3">
        <div class="container" style="max-width: 960px;">
            <div class="d-flex align-items-center gap-2">
                <div class="bg-primary text-white p-2 rounded-3">
                    <i class="fa-solid fa-microphone-lines fs-5"></i>
                </div>
                <div>
                    <span class="fs-4 fw-bold text-white">Ata<span class="text-primary">Flow</span></span>
                    <small class="d-block text-info fw-semibold text-uppercase tracking-wider text-xs">Enterprise AI</small>
                </div>
            </div>
            <span class="badge bg-success-subtle text-success border border-success-subtle rounded-pill px-3 py-2 text-xs">● Sistema Pronto</span>
        </div>
    </nav>

    <!-- Painel de Trabalho -->
    <div class="container container-workspace">
        <div class="row g-4">
            
            <!-- Caixa de Upload -->
            <div class="col-md-6">
                <div class="card-premium h-100 d-flex flex-column justify-content-between">
                    <div>
                        <h5 class="text-white mb-2"><i class="fa-solid fa-cloud-arrow-up text-primary me-2"></i> Upload de Áudio</h5>
                        <p class="text-muted small">Importe gravações prontas do seu computador ou celular.</p>
                    </div>
                    <label class="border border-secondary border-dashed rounded-3 p-4 text-center bg-black bg-opacity-20 d-flex flex-column align-items-center justify-content-center my-3" style="min-height: 120px; cursor: pointer;">
                        <input type="file" id="audio-file" accept=".mp3,.m4a,.wav" class="d-none" onchange="handleFileSelect(event)">
                        <i class="fa-solid fa-file-audio text-secondary fs-1 mb-2"></i>
                        <div id="upload-label" class="text-muted small">Clique para selecionar (.mp3, .m4a, .wav)</div>
                    </label>
                </div>
            </div>

            <!-- Caixa do Gravador -->
            <div class="col-md-6">
                <div class="card-premium h-100 d-flex flex-column justify-content-between">
                    <div>
                        <h5 class="text-white mb-2"><i class="fa-solid fa-circle-dot text-danger me-2"></i> Gravador Digital</h5>
                        <p class="text-muted small">Grave os detalhes da reunião ao vivo usando o microfone.</p>
                    </div>
                    <div class="bg-black bg-opacity-20 border border-secondary rounded-3 p-3 text-center my-3 d-flex flex-column align-items-center justify-content-center" style="min-height: 120px;">
                        <button id="record-btn" onclick="toggleRecording()" class="btn btn-dark rounded-circle d-flex align-items-center justify-content-center" style="width: 55px; height: 55px;">
                            <i class="fa-solid fa-microphone text-secondary fs-5" id="mic-icon"></i>
                        </button>
                        <small id="record-status" class="text-muted d-block mt-2 fw-semibold text-uppercase tracking-wider" style="font-size: 10px;">Microfone Inativo</small>
                    </div>
                </div>
            </div>
        </div>

        <!-- Ação Principal -->
        <div class="text-center my-5">
            <button id="process-btn" onclick="processMeeting()" class="btn-premium shadow">
                <i class="fa-solid fa-wand-magic-sparkles me-2"></i> Gerar Inteligência da Reunião
            </button>
        </div>

        <!-- Tela de Carregamento -->
        <div id="loading-state" class="card-premium p-5 text-center d-none my-4">
            <div class="spinner-border text-primary mb-3" role="status"></div>
            <p class="text-muted m-0">Transcrevendo áudio com IA e estruturando os planos de ação...</p>
        </div>

        <!-- Painel de Resultados -->
        <div id="results-panel" class="card-premium overflow-hidden d-none my-4 p-0">
            <div class="bg-black bg-opacity-30 px-4 py-2 d-flex flex-wrap align-items-center justify-content-between gap-3 border-bottom border-secondary" data-html2canvas-ignore="true">
                <ul class="nav nav-tabs border-0">
                    <li class="nav-item"><button onclick="switchTab('resumo')" id="tab-resumo" class="nav-link active btn">Resumo Executivo</button></li>
                    <li class="nav-item"><button onclick="switchTab('plano')" id="tab-plano" class="nav-link btn">Plano de Ação</button></li>
                    <li class="nav-item"><button onclick="switchTab('transcricao')" id="tab-transcricao" class="nav-link btn">Transcrição Completa</button></li>
                </ul>
                <div class="d-flex gap-2">
                    <button onclick="exportPDF()" class="btn btn-sm btn-outline-light"><i class="fa-solid fa-file-pdf text-danger me-1"></i> PDF</button>
                    <button onclick="copyToWhatsApp()" class="btn btn-sm btn-outline-light"><i class="fa-solid fa-share text-success me-1"></i> Compartilhar</button>
                </div>
            </div>
            <div class="p-4">
                <div id="content-resumo" class="tab-content text-white"></div>
                <div id="content-plano" class="tab-content d-none table-responsive text-white"></div>
                <div id="content-transcricao" class="tab-content d-none text-muted"></div>
            </div>
        </div>
    </div>

    <!-- LÓGICA DE FUNCIONAMENTO (JAVASCRIPT) -->
    <script>
        let selectedFile = null; 
        let mediaRecorder = null; 
        let audioChunks = []; 
        let isRecording = false;

        // 👇👇👇 COLE SUA CHAVE DA API ENTRE AS ASPAS ABAIXO 👇👇👇
        const GEMINI_API_KEY = 'AQ.Ab8RN6L1NDD7ovYwrHEo0wUH7h87EPd-lm5yEnGnHdwzlkFsDQ'; 
        // 👆👆👆👆👆👆👆👆👆👆👆👆👆👆👆👆👆👆👆👆👆👆👆👆👆👆

        function handleFileSelect(e) {
            const f = e.target.files[0];
            if (f) { 
                selectedFile = f; 
                document.getElementById('upload-label').innerText = `Selecionado: ${f.name}`; 
                document.getElementById('upload-label').className = "text-info small fw-bold"; 
            }
        }

        async function toggleRecording() {
            const btn = document.getElementById('record-btn'); 
            const status = document.getElementById('record-status');
            
            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream); 
                    audioChunks = [];
                    mediaRecorder.ondataavailable = e => { audioChunks.push(e.data); };
                    mediaRecorder.onstop = () => {
                        const blob = new Blob(audioChunks, { type: 'audio/mp3' });
                        selectedFile = new File([blob], "gravacao.mp3", { type: 'audio/mp3' });
                        status.innerText = "Áudio capturado!"; 
                        status.className = "text-success d-block mt-2 fw-semibold text-uppercase tracking-wider";
                    };
                    mediaRecorder.start(); 
                    isRecording = true;
                    status.innerText = "Gravando reunião..."; 
                    status.className = "text-danger d-block mt-2 fw-semibold text-uppercase tracking-wider";
                } catch (err) { 
                    alert("Erro no microfone: Verifique as permissões do seu navegador."); 
                }
            } else {
                mediaRecorder.stop(); 
                mediaRecorder.stream.getTracks().forEach(t => t.stop()); 
                isRecording = false;
                btn.className = "btn btn-dark rounded-circle d-flex align-items-center justify-content-center";
            }
        }

        function switchTab(t) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('d-none'));
            document.querySelectorAll('.nav-link').forEach(el => el.classList.remove('active'));
            document.getElementById(`content-${t}`).classList.remove('d-none');
            document.getElementById(`tab-${t}`).classList.add('active');
        }

        // --- INTEGRAÇÃO COM A IA DO GOOGLE GEMINI ---
        async function processMeeting() {
            if (!selectedFile) {
                alert("Por favor, faça o upload de um arquivo de áudio ou grave a reunião primeiro.");
                return;
            }
            if (GEMINI_API_KEY === 'COLE_SUA_CHAVE_AQUI' || GEMINI_API_KEY === '') {
                alert("ATENÇÃO: Você precisa colocar a sua chave da API do Gemini no código para a inteligência artificial funcionar!");
                return;
            }

            document.getElementById('loading-state').classList.remove('d-none');
            document.getElementById('results-panel').classList.add('d-none');

            try {
                const reader = new FileReader();
                reader.readAsDataURL(selectedFile);
                reader.onload = async function () {
                    const base64Data = reader.result.split(',')[1];

                    const prompt = `Ouça este áudio de reunião. Retorne estritamente um arquivo JSON com 3 chaves:
                    "resumo": "Um resumo executivo claro e detalhado em texto.",
                    "plano": "Uma lista de tarefas e planos de ação formatados com tags HTML <ul><li>...</li></ul>.",
                    "transcricao": "A transcrição completa e limpa do que foi dito."`;

                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{
                                parts: [
                                    { text: prompt },
                                    { inlineData: { mimeType: selectedFile.type || "audio/mp3", data: base64Data } }
                                ]
                            }],
                            generationConfig: { responseMimeType: "application/json" }
                        })
                    });

                    const result = await response.json();
                    
                    if(result.error) {
                        throw new Error(result.error.message);
                    }

                    const iaResponse = JSON.parse(result.candidates[0].content.parts[0].text);

                    document.getElementById('content-resumo').innerHTML = `<h5>Resumo Executivo</h5><p>${iaResponse.resumo}</p>`;
                    document.getElementById('content-plano').innerHTML = `<h5>Plano de Ação</h5>${iaResponse.plano}`;
                    document.getElementById('content-transcricao').innerHTML = `<h5>Transcrição Completa</h5><p>${iaResponse.transcricao}</p>`;

                    document.getElementById('loading-state').classList.add('d-none');
                    document.getElementById('results-panel').classList.remove('d-none');
                    switchTab('resumo');
                };
                reader.onerror = error => { throw error; };

            } catch (error) {
                alert("Houve um erro ao processar o áudio com a IA. Detalhes: " + error.message);
                document.getElementById('loading-state').classList.add('d-none');
            }
        }

        // --- FUNCIONALIDADE DE EXPORTAR PDF ---
        function exportPDF() {
            // Mostra todas as abas temporariamente para o PDF capturar tudo
            const todasAbas = document.querySelectorAll('.tab-content');
            todasAbas.forEach(aba => aba.classList.remove('d-none'));

            const element = document.getElementById('results-panel');
            const opt = {
                margin:       0.5,
                filename:     'AtaFlow_Reuniao.pdf',
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, backgroundColor: '#0f172a' },
                jsPDF:        { unit: 'in', format: 'letter', orientation: 'portrait' }
            };
            
            html2pdf().set(opt).from(element).save().then(() => {
                // Restaura a visualização apenas da aba "Resumo" após salvar
                switchTab('resumo');
            });
        }

        // --- FUNCIONALIDADE DE COMPARTILHAMENTO ---
        function copyToWhatsApp() {
            // Pega os textos gerados pela IA
            const resumoText = document.getElementById('content-resumo').innerText;
            const planoText = document.getElementById('content-plano').innerText;
            
            const textoParaEnviar = `*Ata da Reunião - AtaFlow*\n\n${resumoText}\n\n${planoText}`;

            if (navigator.share) {
                navigator.share({
                    title: 'Ata da Reunião',
                    text: textoParaEnviar
                }).catch(console.error);
            } else {
                const url = `https://wa.me/?text=${encodeURIComponent(textoParaEnviar)}`;
                window.open(url, '_blank');
            }
        }
    </script>
</body>
</html>
