<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AtaFlow - Inteligência em Reuniões</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: system-ui, -apple-system, sans-serif !important;
            background-color: #0b1329 !important; 
            color: #f8fafc !important; 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .navbar-premium {
            background-color: #0f172a;
            border-bottom: 2px solid #1e293b;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .brand-title { font-size: 24px; font-weight: 700; color: #ffffff; letter-spacing: -0.5px; }
        .brand-blue { color: #3b82f6; }
        .status-badge { background-color: rgba(16, 185, 129, 0.1); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.2); padding: 6px 16px; border-radius: 9999px; font-size: 12px; font-weight: 600; }
        .workspace-container { max-width: 960px; margin: 40px auto; padding: 0 20px; width: 100%; flex: 1; }
        .grid-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 32px; }
        @media (max-width: 768px) { .grid-cards { grid-template-columns: 1fr; } }
        .card-premium { background-color: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 30px; display: flex; flex-direction: column; justify-content: space-between; min-height: 220px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .card-title { font-size: 18px; font-weight: 700; color: #ffffff; margin-bottom: 8px; }
        .card-desc { font-size: 14px; color: #94a3b8; margin-bottom: 20px; line-height: 1.5; }
        .upload-area { border: 2px dashed #475569; background-color: rgba(15, 23, 42, 0.4); border-radius: 12px; padding: 24px; text-align: center; cursor: pointer; transition: all 0.3s; display: block; }
        .upload-area:hover { border-color: #3b82f6; background-color: rgba(15, 23, 42, 0.6); }
        .btn-mic-container { background-color: rgba(15, 23, 42, 0.4); border: 1px solid #475569; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .btn-round-mic { width: 60px; height: 60px; border-radius: 50%; background-color: #334155; border: none; color: #94a3b8; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 24px; transition: all 0.3s; }
        .btn-round-mic:hover { background-color: #ef4444; color: #ffffff; }
        .status-mic-text { font-size: 11px; font-weight: 700; color: #64748b; text-transform: uppercase; margin-top: 12px; letter-spacing: 1px; }
        .btn-action-premium { background: linear-gradient(135deg, #1d4ed8 0%, #4338ca 100%); border: none; color: #ffffff; font-weight: 600; font-size: 16px; border-radius: 12px; padding: 18px 40px; width: 100%; cursor: pointer; transition: all 0.3s; box-shadow: 0 4px 12px rgba(29, 78, 216, 0.3); text-align: center; margin-top: 10px; }
        .btn-action-premium:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(29, 78, 216, 0.5); }
        .hidden-panel { display: none !important; }
        .results-box { background-color: #1e293b; border: 1px solid #334155; border-radius: 16px; margin-top: 32px; overflow: hidden; }
        .results-header { background-color: rgba(15, 23, 42, 0.4); padding: 16px 24px; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
        .tab-menu { display: flex; gap: 20px; list-style: none; }
        .tab-btn { background: none; border: none; color: #94a3b8; font-size: 14px; font-weight: 600; cursor: pointer; padding-bottom: 8px; border-bottom: 2px solid transparent; }
        .tab-btn.active { color: #38bdf8; border-bottom-color: #38bdf8; }
        .results-body { padding: 24px; color: #cbd5e1; line-height: 1.6; }
        .export-group { display: flex; gap: 10px; }
        .btn-small { background-color: #334155; border: 1px solid #475569; color: #e2e8f0; font-size: 12px; font-weight: 600; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
        .btn-small:hover { background-color: #475569; }
    </style>
</head>
<body>

    <!-- Header Navbar -->
    <div class="navbar-premium">
        <div class="brand-title">Ata<span class="brand-blue">Flow</span></div>
        <div class="status-badge">● Sistema Pronto</div>
    </div>

    <!-- Workspace -->
    <div class="workspace-container">
        <div class="grid-cards">
            <!-- Caixa Upload -->
            <div class="card-premium">
                <div>
                    <div class="card-title">Upload de Áudio</div>
                    <div class="card-desc">Importe gravações prontas do seu computador ou celular de forma simples.</div>
                </div>
                <label class="upload-area">
                    <input type="file" id="audio-file" accept=".mp3,.m4a,.wav" style="display: none;" onchange="handleFileSelect(event)">
                    <div id="upload-label">Clique para selecionar (.mp3, .m4a, .wav)</div>
                </label>
            </div>

            <!-- Caixa Gravador -->
            <div class="card-premium">
                <div>
                    <div class="card-title">Gravador Digital</div>
                    <div class="card-desc">Grave os detalhes estruturados da reunião ao vivo usando o microfone.</div>
                </div>
                <div class="btn-mic-container">
                    <button id="record-btn" onclick="toggleRecording()" class="btn-round-mic">🎙️</button>
                    <div id="record-status" class="status-mic-text">Microfone Inativo</div>
                </div>
            </div>
        </div>

        <!-- Botão Ação -->
        <button id="process-btn" onclick="processMeeting()" class="btn-action-premium">
            Gerar Inteligência da Reunião
        </button>

        <!-- Loading -->
        <div id="loading-state" class="card-premium hidden-panel" style="text-align: center; justify-content: center; min-height: 150px; margin-top: 32px;">
            <div style="font-size: 14px; color: #94a3b8;">Transcrevendo áudio com IA e estruturando os planos de ação...</div>
        </div>

        <!-- Painel Resultados -->
        <div id="results-panel" class="results-box hidden-panel">
            <div class="results-header">
                <ul class="tab-menu">
                    <li><button onclick="switchTab('resumo')" id="tab-resumo" class="tab-btn active">Resumo Executivo</button></li>
                    <li><button onclick="switchTab('plano')" id="tab-plano" class="tab-btn">Plano de Ação</button></li>
                    <li><button onclick="switchTab('transcricao')" id="tab-transcricao" class="tab-btn">Transcrição Completa</button></li>
                </ul>
                <div class="export-group">
                    <button onclick="exportPDF()" class="btn-small">PDF</button>
                    <button onclick="copyToWhatsApp()" class="btn-small">Compartilhar</button>
                </div>
            </div>
            <div class="results-body">
                <div id="content-resumo"></div>
                <div id="content-plano" class="hidden-panel"></div>
                <div id="content-transcricao" class="hidden-panel"></div>
            </div>
        </div>
    </div>

    <!-- Script Corrigido e Descongelado -->
    <script>
        let selectedFile = null; let mediaRecorder = null; let audioChunks = []; let isRecording = false;

        function handleFileSelect(e) {
            const f = e.target.files;
            if (f && f.length > 0) { 
                selectedFile = f[0]; 
                document.getElementById('upload-label').innerText = `Selecionado: ${selectedFile.name}`; 
                document.getElementById('upload-label').style.color = "#3b82f6"; 
            }
        }

        async function toggleRecording() {
            const btn = document.getElementById('record-btn'); const status = document.getElementById('record-status');
            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream); audioChunks = [];
                    mediaRecorder.ondataavailable = e => { audioChunks.push(e.data); };
                    mediaRecorder.onstop = () => {
                        const blob = new Blob(audioChunks, { type: 'audio/mp3' });
                        selectedFile = new File([blob], "gravacao.mp3", { type: 'audio/mp3' });
                        status.innerText = "Áudio capturado!"; status.style.color = "#10b981";
                    };
                    mediaRecorder.start(); isRecording = true;
                    btn.style.backgroundColor = "#ef4444"; btn.style.color = "#ffffff";
                    status.innerText = "Gravando reunião..."; status.style.color = "#ef4444";
                } catch (err) { alert("Por favor, permita o acesso ao microfone nas configurações do seu navegador."); }
            } else {
                mediaRecorder.stop(); mediaRecorder.stream.getTracks().forEach(t => t.stop()); isRecording = false;
                btn.style.backgroundColor = "#334155"; btn.style.color = "#94a3b8";
                status.innerText = "Microfone Inativo"; status.style.color = "#64748b";
            }
        }

        function switchTab(t) {
            document.getElementById('content-resumo').classList.add('hidden-panel');
            document.getElementById('content-plano').classList.add('hidden-panel');
            document.getElementById('content-transcricao').classList.add('hidden-panel');
